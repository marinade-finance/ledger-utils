packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  bufferutil: true
  node-hid: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true

overrides:
  # DROP BEFORE RELEASE: local typescript-common until web3js-kit 5.12.1 is published
  '@marinade.finance/web3js-kit': link:../typescript-common/packages/web3js-kit
  # kit 8 of web3.js 3 would lift the token-2022 sysvars peer (via @trezor/connect) off its kit 6
  '@solana-program/token-2022>@solana/sysvars': 6.10.0

peerDependencyRules:
  allowedVersions:
    # token-2022 0.9 (via @trezor/connect) peers sysvars ^5 but its kit ^6 peer ships sysvars 6
    '@solana-program/token-2022>@solana/sysvars': '6'

onlyBuiltDependencies:
  - bufferutil
  - node-hid
  - unrs-resolver
  - usb
  - utf-8-validate
